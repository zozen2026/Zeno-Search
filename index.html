<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeno Search & AI Assistant</title>
  <!-- استدعاء مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { 
      background-color: #ffffff; 
      color: #111; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh; 
      padding: 40px 20px; 
      position: relative; 
    }

    /* حاوية البروفايل في أعلى اليسار */
    .profile-wrapper {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      z-index: 100;
      cursor: pointer;
    }
    .profile-avatar-container {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #f97316;
      padding: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .profile-avatar-container:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 14px rgba(249, 115, 22, 0.45);
    }
    .profile-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .profile-avatar-img svg {
      width: 28px;
      height: 28px;
      fill: #f97316;
    }
    .profile-name-text {
      margin-top: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      color: #333;
      max-width: 90px;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* القائمة المنبثقة عند الضغط على الحساب */
    .profile-menu {
      display: none;
      position: absolute;
      top: 80px;
      left: 20px;
      background: #ffffff;
      border: 1px solid #e4e4e7;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 220px;
      z-index: 100;
      overflow: hidden;
    }
    .profile-menu .user-name-info {
      padding: 12px 14px;
      font-size: 13px;
      color: #f97316;
      border-bottom: 1px solid #e4e4e7;
      font-weight: bold;
      display: none;
    }
    .profile-menu button {
      width: 100%;
      padding: 12px 14px;
      background: transparent;
      border: none;
      color: #18181b;
      text-align: right;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .profile-menu button:hover { background: #f4f4f5; }

    /* شعار Zeno مع الـ o البرتقالي */
    .logo { 
      font-size: 3.5rem; 
      font-weight: 900; 
      margin-bottom: 20px; 
      letter-spacing: -1px; 
      margin-top: 20px; 
      color: #4285F4;
    }
    .logo span.o-orange { color: #f97316; }

    /* قسم Zeno AI الصوتي والكرة النيون */
    .zeno-ai-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .orb {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb);
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
      cursor: pointer;
      transition: all 0.4s ease;
    }
    .orb:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(249, 115, 22, 0.6);
    }
    .orb.listening {
      background: radial-gradient(circle at 30% 30%, #fdba74, #f97316);
      box-shadow: 0 0 35px #f97316, inset 0 0 15px #fff;
      animation: pulse-orb 1.5s infinite;
    }
    .orb.speaking {
      background: radial-gradient(circle at 30% 30%, #4ade80, #16a34a);
      box-shadow: 0 0 35px #22c55e, inset 0 0 15px #fff;
      animation: pulse-orb 0.8s infinite;
    }
    @keyframes pulse-orb {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .ai-status-text {
      font-size: 0.85rem;
      color: #52525b;
      font-weight: bold;
      min-height: 20px;
      text-align: center;
    }

    /* شريط البحث */
    .search-container { width: 100%; max-width: 600px; display: flex; gap: 10px; margin-bottom: 25px; }
    input[type="text"], textarea { flex: 1; padding: 14px 20px; font-size: 1rem; border: 2px solid #e5e7eb; border-radius: 30px; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus, textarea:focus { border-color: #f97316; }
    
    .btn { padding: 12px 24px; background-color: #111; color: #fff; border: 2px solid #111; border-radius: 30px; font-weight: bold; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .btn:hover { background-color: #f97316; border-color: #f97316; }

    /* حاوية نتائج البحث الخاصة بـ Zeno */
    .results-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 40px; }
    .result-card { background: #ffffff; border: 2px solid #111; border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-right: 6px solid #f97316; }
    .result-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
    .result-title a { color: #4285F4; text-decoration: none; }
    .result-title a:hover { text-decoration: underline; }
    .result-snippet { font-size: 0.95rem; color: #4b5563; line-height: 1.8; word-break: break-word; margin-bottom: 12px; }
    .result-author { font-size: 0.85rem; color: #f97316; font-weight: bold; border-top: 1px solid #f3f4f6; padding-top: 8px; display: flex; align-items: center; gap: 5px; }
    .no-result { text-align: center; color: #9ca3af; padding: 20px; font-size: 0.95rem; }

    /* النوافذ المنبثقة (Modals) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      width: 320px;
      border: 1px solid #e4e4e7;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .modal-card h3 { color: #f97316; text-align: center; font-size: 18px; }
    .modal-card input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d4d4d8;
      background: #f4f4f5;
      color: #18181b;
      outline: none;
    }
    .password-strength-indicator { font-size: 12px; margin-top: -6px; margin-bottom: 2px; }
    .modal-card button.submit-btn {
      padding: 10px;
      background: #f97316;
      color: #ffffff;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .modal-card button.submit-btn:hover { background: #ea580c; }
    .modal-card .close-btn { background: transparent; color: #71717a; border: none; cursor: pointer; font-size: 12px; text-align: center; }

    /* العلامة المائية الشفافة */
    .watermark-nc {
      position: fixed;
      bottom: 15px;
      left: 20px;
      font-size: 13px;
      color: #71717a;
      opacity: 0.25;
      pointer-events: none;
      user-select: none;
      z-index: 10;
      font-weight: bold;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- حاوية البروفايل واسم المستخدم -->
  <div class="profile-wrapper" id="profile-icon" title="الملف الشخصي">
    <div class="profile-avatar-container">
      <div class="profile-avatar-img">
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
    </div>
    <span class="profile-name-text" id="display-account-name">زائر</span>

    <!-- قائمة خيارات الحساب -->
    <div class="profile-menu" id="profile-menu">
      <div class="user-name-info" id="user-name-info"></div>
      <button id="btn-show-login">تسجيل الدخول</button>
      <button id="btn-show-signup">إنشاء حساب جديد</button>
      <button id="btn-logout" style="display:none; color:#ef4444;">تسجيل الخروج</button>
    </div>
  </div>

  <!-- شعار Zeno مع الـ o البرتقالي -->
  <div class="logo">
    Zen<span class="o-orange">o</span>
  </div>

  <!-- قسم Zeno AI الصوتي والكرة النيون -->
  <div class="zeno-ai-section">
    <div class="orb" id="aiOrb" onclick="startZenoListening()" title="اضغط وتحدث مع Zeno AI"></div>
    <div class="ai-status-text" id="aiStatus">اضغط على الكرة وتحدث...</div>
  </div>

  <!-- شريط البحث الأساسي -->
  <div class="search-container">
    <button class="btn" id="search-btn" onclick="handleSearch()">Search</button>
    <input type="text" id="search-input" placeholder="...Zeno Search" onkeydown="if(event.key === 'Enter') handleSearch()">
  </div>

  <!-- منطقة عرض نتائج البحث بأسلوب Zeno Search -->
  <div class="results-container" id="results-container">
    <div class="no-result">اكتب ما تبحث عنه في الأعلى، وستظهر النتائج هنا بتصميم Zeno...</div>
  </div>

  <!-- نافذة تسجيل الدخول -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal-card">
      <h3>تسجيل الدخول - Zeno</h3>
      <input type="text" id="login-username" placeholder="اسم المستخدم">
      <input type="password" id="login-password" placeholder="كلمة المرور">
      <button class="submit-btn" id="login-submit">دخول</button>
      <button class="close-btn" id="login-close">إلغاء</button>
    </div>
  </div>

  <!-- نافذة إنشاء حساب جديد -->
  <div class="modal-overlay" id="signup-modal">
    <div class="modal-card">
      <h3>إنشاء حساب جديد - Zeno</h3>
      <input type="text" id="signup-username" placeholder="اسم المستخدم (مثل: @user)">
      <input type="text" id="signup-accountname" placeholder="اسم الحساب الظاهر">
      <input type="password" id="signup-password" placeholder="كلمة المرور">
      <div class="password-strength-indicator" id="strength-text">مستوى كلمة المرور: <span style="color:#71717a;">لم تكتب بعد</span></div>
      <button class="submit-btn" id="signup-submit">إنشاء الحساب</button>
      <button class="close-btn" id="signup-close">إلغاء</button>
    </div>
  </div>

  <!-- العلامة المائية الشفافة -->
  <div class="watermark-nc">From NC©</div>

  <script>
    // -------------------------------------------------------------
    // التحقق التلقائي من الحساب
    // -------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('zeno_current_user');
      if (savedUser) {
        try {
          const userObj = JSON.parse(savedUser);
          updateUIAuthState(userObj);
        } catch (e) {
          console.error("خطأ في قراءة بيانات المستخدم", e);
        }
      }
    });

    // -------------------------------------------------------------
    // 1. إعداد Supabase
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://lzvtnfdgynwczrkwlwhf.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dnRuZmRneW53Y3pya3dsd2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDIxMTEsImV4cCI6MjEwNDcxODExMX0.w2hNlJ4SszyMBkUVjr1qiWNTTPxHMHkM9YOFtVP-pVI";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // -------------------------------------------------------------
    // 2. إدارة البروفايل والحسابات
    // -------------------------------------------------------------
    const profileIcon = document.getElementById('profile-icon');
    const profileMenu = document.getElementById('profile-menu');
    const userNameInfo = document.getElementById('user-name-info');
    const loginModal = document.getElementById('login-modal');
    const signupModal = document.getElementById('signup-modal');

    profileIcon.addEventListener('click', (e) => {
      e.stopPropagation();
      profileMenu.style.display = profileMenu.style.display === 'block' ? 'none' : 'block';
    });

    document.addEventListener('click', () => {
      profileMenu.style.display = 'none';
    });

    document.getElementById('btn-show-login').onclick = () => { loginModal.style.display = 'flex'; };
    document.getElementById('btn-show-signup').onclick = () => { signupModal.style.display = 'flex'; };
    document.getElementById('login-close').onclick = () => { loginModal.style.display = 'none'; };
    document.getElementById('signup-close').onclick = () => { signupModal.style.display = 'none'; };

    // مقياس قوة كلمة المرور
    const signupPasswordInput = document.getElementById('signup-password');
    const strengthText = document.getElementById('strength-text');

    signupPasswordInput.addEventListener('input', () => {
      const pass = signupPasswordInput.value;
      if (!pass) {
        strengthText.innerHTML = 'مستوى كلمة المرور: <span style="color:#71717a;">لم تكتب بعد</span>';
        return;
      }

      let score = 0;
      if (pass.length >= 6) score++;
      if (pass.length >= 8) score++;
      if (/[A-Z]/.test(pass) && /[a-z]/.test(pass)) score++;
      if (/[0-9]/.test(pass)) score++;
      if (/[^A-Za-z0-9]/.test(pass)) score++;

      if (score <= 2) {
        strengthText.innerHTML = 'مستوى كلمة المرور: <span style="color:#ef4444; font-weight:bold;">ضعيف 🔴</span>';
      } else if (score <= 4) {
        strengthText.innerHTML = 'مستوى كلمة المرور: <span style="color:#f59e0b; font-weight:bold;">متوسط 🟡</span>';
      } else {
        strengthText.innerHTML = 'مستوى كلمة المرور: <span style="color:#22c55e; font-weight:bold;">قوي 🟢</span>';
      }
    });

    // إنشاء حساب جديد
    document.getElementById('signup-submit').onclick = async () => {
      let username = document.getElementById('signup-username').value.trim();
      let accountName = document.getElementById('signup-accountname').value.trim();
      const password = document.getElementById('signup-password').value;

      if(!username || !password) return alert('يرجى كتابة اسم المستخدم وكلمة المرور');
      if(!accountName) accountName = username;

      const { data: existing } = await supabaseClient
        .from('accounts')
        .select('*')
        .eq('username', username);

      if (existing && existing.length > 0) {
        return alert('اسم المستخدم موجود مسبقاً، اختر اسماً آخر.');
      }

      const { data, error } = await supabaseClient
        .from('accounts')
        .insert([{
          username: username,
          account_name: accountName,
          password: password,
          language: 'ar'
        }])
        .select();

      if (error) {
        alert('خطأ في إنشاء الحساب: ' + error.message);
      } else {
        alert('تم إنشاء الحساب بنجاح!');
        signupModal.style.display = 'none';
        if (data && data[0]) {
          localStorage.setItem('zeno_current_user', JSON.stringify(data[0]));
          updateUIAuthState(data[0]);
        }
      }
    };

    // تسجيل الدخول
    document.getElementById('login-submit').onclick = async () => {
      let username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      if(!username || !password) return alert('يرجى كتابة اسم المستخدم وكلمة المرور');

      const { data, error } = await supabaseClient
        .from('accounts')
        .select('*')
        .eq('username', username)
        .eq('password', password);

      if (error || !data || data.length === 0) {
        alert('فشل تسجيل الدخول: اسم المستخدم أو كلمة المرور غير مطابقة تماماً.');
      } else {
        const userObj = data[0];
        localStorage.setItem('zeno_current_user', JSON.stringify(userObj));
        updateUIAuthState(userObj);
        alert('أهلاً بك ' + (userObj.account_name || userObj.username) + '!');
        loginModal.style.display = 'none';
      }
    };

    document.getElementById('btn-logout').onclick = () => {
      localStorage.removeItem('zeno_current_user');
      updateUIAuthState(null);
      alert('تم تسجيل الخروج بنجاح');
    };

    function updateUIAuthState(user) {
      if (user) {
        document.getElementById('display-account-name').innerText = user.account_name || user.username;
        userNameInfo.textContent = `الحساب: ${user.account_name || user.username}`;
        userNameInfo.style.display = 'block';
        document.getElementById('btn-show-login').style.display = 'none';
        document.getElementById('btn-show-signup').style.display = 'none';
        document.getElementById('btn-logout').style.display = 'block';
      } else {
        document.getElementById('display-account-name').innerText = 'زائر';
        userNameInfo.style.display = 'none';
        document.getElementById('btn-show-login').style.display = 'block';
        document.getElementById('btn-show-signup').style.display = 'block';
        document.getElementById('btn-logout').style.display = 'none';
      }
    }

    // -------------------------------------------------------------
    // 3. جلب معلومات الويب مباشرة في المتصفح وعرضها بأسلوب Zeno Search
    // -------------------------------------------------------------
    async function handleSearch() {
      const rawQuery = document.getElementById('search-input').value.trim();
      const container = document.getElementById('results-container');

      if (!rawQuery) {
        container.innerHTML = '<div class="no-result">الرجاء كتابة كلمة للبحث.</div>';
        return;
      }

      container.innerHTML = '<div class="no-result">جاري البحث وجلب النتائج من شبكة الويب...</div>';

      try {
        // جلب البيانات مباشرة من واجهة بحث عامة مدعومة بالمتصفح
        const searchUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(rawQuery)}&format=json&no_html=1&skip_disambig=1`;
        const response = await fetch(searchUrl);
        const data = await response.json();

        let results = [];

        if (data.AbstractText) {
          results.push({
            title: data.Heading || rawQuery,
            snippet: data.AbstractText,
            url: data.AbstractURL || '#'
          });
        }

        if (data.RelatedTopics && data.RelatedTopics.length > 0) {
          data.RelatedTopics.forEach(item => {
            if (item.Text && item.FirstURL) {
              results.push({
                title: item.Text.split(' - ')[0] || rawQuery,
                snippet: item.Text,
                url: item.FirstURL
              });
            }
          });
        }

        if (results.length === 0) {
          results.push({
            title: `نتائج البحث عن: ${rawQuery}`,
            snippet: `تمت مراجعة المصادر المتاحة لـ "${rawQuery}". استعرض التفاصيل عبر النقر على الرابط المخصص.`,
            url: `https://duckduckgo.com/?q=${encodeURIComponent(rawQuery)}`
          });
        }

        // عرض النتائج بتصميم بطاقات Zeno الفاخرة
        container.innerHTML = results.map(item => `
          <div class="result-card">
            <div class="result-title">
              <a href="${item.url}" target="_blank">${item.title}</a>
            </div>
            <div class="result-snippet">${item.snippet}</div>
            <div class="result-author">🛡️ محرك بحث Zeno الذكي (تطوير استوديو NC)</div>
          </div>
        `).join('');

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="no-result" style="color:red;">حدث خطأ أثناء جلب النتائج. حاول مرة أخرى.</div>';
      }
    }

    // -------------------------------------------------------------
    // 4. تشغيل Zeno AI الصوتي (مع سحب معلومات الويب وإرسالها للذكاء الاصطناعي)
    // -------------------------------------------------------------
    const orb = document.getElementById('aiOrb');
    const aiStatus = document.getElementById('aiStatus');

    let conversationMessages = [
        { 
            role: "system", 
            content: "أنت Zeno AI، مساعد ذكي وصديق مقرب جداً لمصطفى في مشروع Zeno Search. تحدث دائماً بطريقة بشرية طبيعية، ودودة، عفوية باللغة العربية. إذا سألك أي شخص عن من صنعك أو طورك أو أنشأك، يجب أن تكون إجابتك حرفياً: 'من طورني هو استوديو NC'." 
        }
    ];

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;
    let manualStop = false;
    let isAISpeaking = false;
    let currentUtterance = null;
    let arabicVoice = null;

    function loadVoices() {
        const voices = window.speechSynthesis.getVoices();
        arabicVoice = voices.find(v => v.lang === 'ar-SA' || v.lang.startsWith('ar')) || voices[0];
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ar-SA';
        recognition.continuous = true; 
        recognition.interimResults = false;

        recognition.onstart = () => {
            if (!isAISpeaking) {
                isListening = true;
                orb.className = "orb listening";
                aiStatus.innerText = "Zeno يستمع إليك الآن... (اضغط للإيقاف)";
            }
        };

        recognition.onresult = async (event) => {
            if (isAISpeaking) return;
            const userSpeech = event.results[event.results.length - 1][0].transcript;
            aiStatus.innerText = "أنت: " + userSpeech;
            
            // جلب معلومات من الويب بناءً على كلام المستخدم لكي يجيب الذكاء الاصطناعي حسبها
            aiStatus.innerText = "Zeno يبحث في الويب ليجيبك...";
            let webContext = "";
            try {
                const res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(userSpeech)}&format=json&no_html=1&skip_disambig=1`);
                const sData = await res.json();
                if (sData.AbstractText) webContext = sData.AbstractText;
            } catch (e) {}

            const promptMessage = webContext ? `سؤال المستخدم: ${userSpeech}\n\nمعلومات مسترجعة من الويب قدفيدك: ${webContext}` : userSpeech;

            conversationMessages.push({ role: "user", content: promptMessage });
            await askZenoServer();
        };

        recognition.onerror = (event) => {
            console.log("خطأ في التعرف على الصوت:", event.error);
        };

        recognition.onend = () => {
            if (isListening && !manualStop && !isAISpeaking) {
                try { recognition.start(); } catch (e) {}
            } else if (!isAISpeaking && !isListening) {
                orb.className = "orb";
                aiStatus.innerText = "اضغط على الكرة وتحدث...";
            }
        };
    }

    function startZenoListening() {
        if (!recognition) {
            alert("متصفحك لا يدعم خاصية التعرف على الصوت.");
            return;
        }

        if (isListening) {
            manualStop = true;
            isListening = false;
            try { recognition.stop(); } catch (e) {}
            orb.className = "orb";
            aiStatus.innerText = "تم إيقاف الاستماع يدوياً.";
        } else {
            manualStop = false;
            try { recognition.start(); } catch (e) {}
        }
    }

    async function askZenoServer() {
        aiStatus.innerText = "Zeno يفكر في الإجابة...";

        try {
            const apiEndpoint = window.location.hostname === 'localhost' ? 'http://localhost:3000/api/chat' : '/api/chat';

            const response = await fetch(apiEndpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: conversationMessages })
            });

            const data = await response.json();
            
            if (!response.ok) {
                aiStatus.innerText = data.error?.message || "عذراً، حدث خطأ في الخادم.";
                return;
            }
            
            if (data.choices && data.choices.length > 0) {
                const aiReply = data.choices[0].message.content;
                conversationMessages.push({ role: "assistant", content: aiReply });
                speakZenoReply(aiReply);
            } else {
                aiStatus.innerText = "عذراً، لم تصل استجابة صحيحة.";
            }

        } catch (err) {
            console.error(err);
            aiStatus.innerText = "فشل الاتصال بالخادم الوسيط!";
        }
    }

    function cleanTextForSpeech(text) {
        return text
            .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF]|\uD800-\uDBFF[\uDC00-\uDFFF])/g, '')
            .replace(/[#_*~`@$%^&+=<>|\\/[\]{}()]/g, ' ')
            .replace(/-/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function speakZenoReply(text) {
        isAISpeaking = true; 
        if (recognition) { try { recognition.stop(); } catch(e) {} }

        aiStatus.innerText = "Zeno: " + text;
        const cleanSpeechText = cleanTextForSpeech(text) || "أهلاً بك";

        window.speechSynthesis.cancel();
        currentUtterance = new SpeechSynthesisUtterance(cleanSpeechText);
        currentUtterance.lang = 'ar-SA';
        currentUtterance.rate = 0.95; 

        if (!arabicVoice) loadVoices();
        if (arabicVoice) currentUtterance.voice = arabicVoice;

        currentUtterance.onstart = () => { orb.className = "orb speaking"; };
        currentUtterance.onend = () => {
            isAISpeaking = false; 
            if (isListening && !manualStop) {
                orb.className, orb.className = "orb listening";
                aiStatus.innerText = "Zeno يستمع إليك الآن...";
                try { recognition.start(); } catch(e) {}
            } else {
                orb.className = "orb"; 
                aiStatus.innerText = "اضغط على الكرة وتحدث...";
            }
        };

        window.speechSynthesis.speak(currentUtterance);
    }
  </script>
